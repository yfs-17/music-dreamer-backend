server:
  port: 8087

spring:
  application:
    name: music-upload

  # nacos-config 在 classpath 上时必须有 nacos: 条目，否则启动直接失败。
  # optional: 表示该配置在 Nacos 上不存在时静默跳过 —— 什么都不建也能启动。
  config:
    import:
      # 本地开发把 OSS 等密钥放在项目根目录的 .env（已被 .gitignore 忽略）。
      # 两个路径都列上：命令行从根目录启动时命中 ./，IDEA 以模块目录为工作目录时命中 ../
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
      - optional:nacos:music-common.yaml
      - optional:nacos:music-upload.yaml

  # 音频最大 50MB；默认 1MB 会让正常音频直接 413
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        group: DEFAULT_GROUP
      config:
        group: DEFAULT_GROUP
        file-extension: yaml
        refresh-enabled: true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:music_upload_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    hikari:
      pool-name: music-upload-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123}
      database: 0
      timeout: 5s

  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:music}
    password: ${RABBITMQ_PASSWORD:music123}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
        concurrency: 2
        max-concurrency: 8

aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${OSS_BUCKET_NAME:}
    # 可选：CDN / 自定义域名，配置后用它拼接访问 URL
    public-base-url: ${OSS_PUBLIC_BASE_URL:}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.music.upload.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

music:
  jwt:
    secret: ${JWT_SECRET:music-dreamer-please-change-this-secret-key-32bytes}
  upload:
    # oss：上传到阿里云 OSS；local：落到本地目录，适合没有外网/未配密钥时开发
    storage-type: ${UPLOAD_STORAGE:oss}
    local-dir: ${UPLOAD_LOCAL_DIR:./uploads}
    # local 模式下返回给前端的访问前缀（经网关，前端同源代理 /api）
    public-base-url: ${UPLOAD_PUBLIC_BASE_URL:/api/upload/files}
    # 对象键前缀，最终形如 music/audio/2026/10/22/uuid.mp3
    object-prefix: ${UPLOAD_OBJECT_PREFIX:music/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.music.upload.mapper: debug
