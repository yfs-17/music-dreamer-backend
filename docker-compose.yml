# 基础设施容器：Nacos（注册 + 配置中心）、Redis、RabbitMQ
# MySQL 使用你本机已安装的实例，不在此文件中
#
# 启动：docker compose up -d
# 停止：docker compose down        （加 -v 会一并删除数据卷）
#
# 关于 NACOS_AUTH_TOKEN：必须是 base64 编码，且**解码后**长度不小于 32 字节。
# 下面的默认值仅供本地开发，正式环境请用 `openssl rand -hex 16 | base64` 重新生成并写入 .env

name: music-dreamer

services:
  nacos:
    image: nacos/nacos-server:v3.1.0
    container_name: music-nacos
    restart: unless-stopped
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_TOKEN=${NACOS_AUTH_TOKEN:-VGhpc0lzTXlDdXN0b21TZWNyZXRLZXkwMTIzNDU2Nzg5MTIzNDU2Nzg5MDEyMzQ1Njc4OTA=}
      - NACOS_AUTH_IDENTITY_KEY=${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      - NACOS_AUTH_IDENTITY_VALUE=${NACOS_AUTH_IDENTITY_VALUE:-security}
      - TIME_ZONE=Asia/Shanghai
      # Nacos 默认 2G 堆，开发机下调
      - JVM_XMS=512m
      - JVM_XMX=512m
      - JVM_XMN=256m
    ports:
      - "8848:8848"   # 主端口（客户端 HTTP）
      - "9848:9848"   # gRPC，客户端必需
      - "9849:9849"   # gRPC，集群间通信
      - "8080:8080"   # Nacos 3 控制台（网关因此改用 9000）
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs

  redis:
    image: redis:8
    container_name: music-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-redis123}
      - --appendonly
      - "yes"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: music-rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-music}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-music123}
      - RABBITMQ_DEFAULT_VHOST=/
      - TZ=Asia/Shanghai
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # 管理台
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  nacos-data:
  nacos-logs:
  redis-data:
  rabbitmq-data:
